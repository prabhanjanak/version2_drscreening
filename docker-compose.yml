version: '3.8'

services:
  # Express API Backend Server
  api:
    build:
      context: .
      target: api
    container_name: retinopathy-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/netrartha_db}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-to-a-secure-random-secret}
      - JWT_SECRET=${JWT_SECRET:-change-me-to-another-secure-random-secret}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/artifacts/api-server/uploads

  # Nginx Frontend Web Application
  web:
    build:
      context: .
      target: web
    container_name: retinopathy-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

  # PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: retinopathy-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-netrartha_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d netrartha_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads_data:
